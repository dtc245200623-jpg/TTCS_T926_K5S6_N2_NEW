server:
  port: 8080

spring:
  application:
    name: auth-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:no-reply@example.com}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/atsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # Secret key tối thiểu 256 bits cho HS256
  secret: mySecretKeyForJwtSigningMustBeVeryLongAndSecure12345678
  # Thời gian hết hạn của token: 24h = 86400000 ms
  expiration-ms: 86400000

app:
  password-reset-url: ${PASSWORD_RESET_URL:http://localhost:5500/forgot-password.html}
