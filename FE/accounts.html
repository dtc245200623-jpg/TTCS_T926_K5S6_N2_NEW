<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài khoản và hồ sơ</title><link rel="stylesheet" href="accounts.css"></head>
<body><main class="wrap"><header><a href="dashboard.html">← Bảng điều khiển</a><button id="logout">Đăng xuất</button></header>
<h1>Tài khoản &amp; hồ sơ cá nhân</h1><section class="card"><h2>Hồ sơ của tôi</h2><form id="profile"><label>Họ và tên<input name="fullName" required maxlength="120"></label><label>Email<input name="email" required type="email"></label><label>Số điện thoại<input name="phone" maxlength="30"></label><div class="avatar-editor"><label for="avatarFile">Ảnh đại diện (PNG/JPEG, tối đa 1 MB)<input id="avatarFile" type="file" accept="image/png,image/jpeg"></label><div class="avatar-preview"><img id="avatarPreview" alt="Ảnh đại diện hiện tại" hidden><span id="avatarFallback">Chưa có ảnh đại diện</span><button id="removeAvatar" type="button" class="secondary" hidden>Gỡ ảnh</button></div><input id="avatarData" name="avatarData" type="hidden"></div><label>Tên đăng nhập<input id="username" disabled></label><label>Vai trò<input id="role" disabled></label><button>Lưu hồ sơ</button><p id="profileMsg" role="status"></p></form></section>
<section class="card" id="adminPanel" hidden><h2>Quản trị tài khoản nội bộ</h2><form id="create"><h3>Tạo tài khoản</h3><div class="grid"><label>Họ và tên<input name="fullName" required></label><label>Tên đăng nhập<input name="username" required minlength="3"></label><label>Email<input name="email" type="email" required></label><label>Số điện thoại<input name="phone"></label><label>Mật khẩu tạm<input name="password" type="password" minlength="10" required></label><label>Vai trò<select name="role"><option>ROLE_RECRUITER</option><option>ROLE_HR_MANAGER</option><option>ROLE_HIRING_MANAGER</option><option>ROLE_INTERVIEWER</option><option>ROLE_APPROVER</option><option>ROLE_ADMIN</option></select></label></div><button>Tạo tài khoản</button><p id="createMsg" role="status"></p></form><h3>Tài khoản hiện có</h3><label class="search-label">Tìm theo tên đăng nhập, họ tên hoặc email<input id="accountSearch" type="search" autocomplete="off" placeholder="Nhập từ khóa tìm kiếm"></label><p id="accountMsg" role="status"></p><div class="scroll"><table><thead><tr><th>Tài khoản / họ tên</th><th>Email</th><th>Điện thoại</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="session.js"></script><script src="access-control.js"></script><script src="accounts.js"></script></body></html>
