<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <title>Đặt lại mật khẩu – Hệ thống Tuyển dụng Nội bộ</title>
    <style>
        :root { color-scheme: light; font-family: Inter, "Segoe UI", system-ui, sans-serif; color: #0f172a; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f7fb; }
        .card { width: min(100%, 440px); padding: 36px; background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; box-shadow: 0 20px 50px #0f172a12; }
        .brand { margin: 0 0 8px; text-align: center; color: #2563eb; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
        h1 { margin: 0; text-align: center; color: #1e3a8a; font-size: 26px; }
        .intro { margin: 12px 0 26px; text-align: center; color: #64748b; font-size: 14px; line-height: 1.6; }
        .field { margin: 0 0 18px; }
        label { display: block; margin-bottom: 7px; color: #334155; font-size: 14px; font-weight: 650; }
        input { width: 100%; height: 46px; padding: 0 13px; border: 1px solid #cbd5e1; border-radius: 9px; outline: none; font: inherit; font-size: 14px; }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #2563eb20; }
        button { width: 100%; min-height: 46px; border: 0; border-radius: 9px; background: #2563eb; color: white; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        button:disabled { opacity: .65; cursor: wait; }
        .status { display: none; margin: 0 0 18px; padding: 12px 14px; border-radius: 9px; font-size: 14px; line-height: 1.5; }
        .status.visible { display: block; }
        .status.info { background: #eff6ff; color: #1e40af; }
        .status.error { background: #fef2f2; color: #b91c1c; }
        .status.success { background: #ecfdf5; color: #047857; }
        .back { display: block; margin-top: 22px; color: #64748b; text-align: center; text-decoration: none; font-size: 14px; }
        .back:hover { color: #2563eb; text-decoration: underline; }
        [hidden] { display: none !important; }
        @media (max-width: 480px) { .card { padding: 28px 22px; } }
    </style>
</head>
<body>
    <main class="card">
        <p class="brand">Hệ thống Tuyển dụng Nội bộ</p>
        <h1 id="pageTitle">Quên mật khẩu</h1>
        <p class="intro" id="pageIntro">Nhập email đã đăng ký để bắt đầu đặt lại mật khẩu.</p>
        <div class="status" id="statusMessage" role="status" aria-live="polite"></div>

        <form id="requestForm">
            <div class="field">
                <label for="email">Email công việc</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="example@company.com" required>
            </div>
            <button id="requestButton" type="submit">Gửi yêu cầu đặt lại</button>
        </form>

        <form id="confirmForm" hidden>
            <div class="field">
                <label for="token">Mã xác nhận</label>
                <input id="token" name="token" type="text" autocomplete="one-time-code" required>
            </div>
            <div class="field">
                <label for="newPassword">Mật khẩu mới</label>
                <input id="newPassword" name="newPassword" type="password" minlength="8" maxlength="64" pattern="(?=.*[A-Za-z])(?=.*\d).{8,64}" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="confirmPassword">Nhập lại mật khẩu mới</label>
                <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="64" autocomplete="new-password" required>
            </div>
            <button id="confirmButton" type="submit">Xác nhận mật khẩu mới</button>
        </form>

        <a class="back" href="index.html">← Quay lại đăng nhập</a>
    </main>
    <script src="forgot-password.js"></script>
</body>
</html>
