<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Danh mục Chức danh</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 30px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 24px;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 16px;
            border-radius: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-sub);
        }

        .form-control {
            padding: 10px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-warning {
            background-color: var(--warning);
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            margin-right: 4px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f8fafc;
            color: var(--text-sub);
            font-weight: 600;
        }

        .badge-level {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .empty-row {
            text-align: center;
            color: var(--text-sub);
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Quản lý Danh mục Chức danh</h1>

        <!-- Form Thêm / Sửa -->
        <form id="jobTitleForm" onsubmit="saveJobTitle(event)">
            <input type="hidden" id="editIndex" value="-1">
            <div class="form-grid">
                <div class="form-group">
                    <label for="titleCode">Mã chức danh *</label>
                    <input type="text" id="titleCode" class="form-control" placeholder="VD: DEV_01" required>
                </div>
                <div class="form-group">
                    <label for="titleName">Tên chức danh *</label>
                    <input type="text" id="titleName" class="form-control" placeholder="VD: Lập trình viên" required>
                </div>
                <div class="form-group">
                    <label for="titleLevel">Cấp bậc *</label>
                    <select id="titleLevel" class="form-control" required>
                        <option value="">-- Chọn cấp bậc --</option>
                        <option value="Intern/Fresher">Intern/Fresher</option>
                        <option value="Junior">Junior</option>
                        <option value="Middle">Middle</option>
                        <option value="Senior">Senior</option>
                        <option value="Lead/Manager">Lead/Manager</option>
                    </select>
                </div>
                <div class="form-group" style="justify-content: flex-end;">
                    <button type="submit" id="btnSubmit" class="btn btn-primary">Thêm chức danh</button>
                </div>
            </div>
        </form>

        <!-- Tìm kiếm và Lọc -->
        <div class="toolbar">
            <input type="text" id="searchInput" class="form-control search-box" placeholder="Tìm kiếm theo mã hoặc tên chức danh..." oninput="renderTable()">
            <select id="filterLevel" class="form-control" style="width: 200px;" onchange="renderTable()">
                <option value="">Tất cả cấp bậc</option>
                <option value="Intern/Fresher">Intern/Fresher</option>
                <option value="Junior">Junior</option>
                <option value="Middle">Middle</option>
                <option value="Senior">Senior</option>
                <option value="Lead/Manager">Lead/Manager</option>
            </select>
        </div>

        <!-- Bảng Dữ liệu -->
        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">STT</th>
                    <th>Mã chức danh</th>
                    <th>Tên chức danh</th>
                    <th>Cấp bậc</th>
                    <th style="width: 140px;">Thao tác</th>
                </tr>
            </thead>
            <tbody id="jobTableBody">
            </tbody>
        </table>
    </div>

    <script>
        let jobTitles = [
            { code: "DEV_01", name: "Lập trình viên Frontend", level: "Junior" },
            { code: "DEV_02", name: "Lập trình viên Backend", level: "Senior" },
            { code: "PM_01", name: "Quản trị dự án (PM)", level: "Lead/Manager" }
        ];

        function renderTable() {
            const tbody = document.getElementById('jobTableBody');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const filterLevel = document.getElementById('filterLevel').value;

            tbody.innerHTML = '';

            const filteredData = jobTitles.filter(item => {
                const matchesSearch = item.code.toLowerCase().includes(searchKeyword) || 
                                      item.name.toLowerCase().includes(searchKeyword);
                const matchesLevel = filterLevel === '' || item.level === filterLevel;
                return matchesSearch && matchesLevel;
            });

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-row">Không tìm thấy chức danh phù hợp</td></tr>`;
                return;
            }

            filteredData.forEach((item, index) => {
                const originalIndex = jobTitles.indexOf(item);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${item.code}</strong></td>
                    <td>${item.name}</td>
                    <td><span class="badge-level">${item.level}</span></td>
                    <td>
                        <button class="btn btn-warning" onclick="editJobTitle(${originalIndex})">Sửa</button>
                        <button class="btn btn-danger" onclick="deleteJobTitle(${originalIndex})">Xóa</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function saveJobTitle(event) {
            event.preventDefault();
            const code = document.getElementById('titleCode').value.trim().toUpperCase();
            const name = document.getElementById('titleName').value.trim();
            const level = document.getElementById('titleLevel').value;
            const editIndex = parseInt(document.getElementById('editIndex').value);

            if (editIndex === -1) {
                if (jobTitles.some(item => item.code === code)) {
                    alert('Mã chức danh này đã tồn tại!');
                    return;
                }
                jobTitles.push({ code, name, level });
            } else {
                jobTitles[editIndex] = { code, name, level };
                document.getElementById('editIndex').value = "-1";
                document.getElementById('btnSubmit').textContent = "Thêm chức danh";
            }

            document.getElementById('jobTitleForm').reset();
            renderTable();
        }

        function editJobTitle(index) {
            const item = jobTitles[index];
            document.getElementById('titleCode').value = item.code;
            document.getElementById('titleName').value = item.name;
            document.getElementById('titleLevel').value = item.level;
            document.getElementById('editIndex').value = index;
            document.getElementById('btnSubmit').textContent = "Cập nhật";
        }

        function deleteJobTitle(index) {
            if (confirm(`Bạn có chắc chắn muốn xóa chức danh "${jobTitles[index].name}" không?`)) {
                jobTitles.splice(index, 1);
                renderTable();
            }
        }

        renderTable();
    </script>
</body>
</html>
